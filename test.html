<!doctype html>
<meta charset="utf-8">
<title>Made by Us tests</title>
<pre id="out"></pre>
<script src="core.js"></script>
<script src="variants.js"></script>
<script>
(function () {
  const M = window.MBU, V = M.VARIANTS;
  const lines = [];
  let fails = 0;
  function eq(name, got, want) {
    const ok = JSON.stringify(got) === JSON.stringify(want);
    if (!ok) fails++;
    lines.push((ok ? 'PASS ' : 'FAIL ') + name + (ok ? '' : `  got=${JSON.stringify(got)} want=${JSON.stringify(want)}`));
  }
  const grade = (vid, code) => M.GRADES[V[vid].score(V[vid].decode(code)).gradeIndex];

  // Scenario grades, per variant. These are the numbers the group compares.
  const expected = {
    'Own engine, everything handmade':                          ['A+', 'A+', 'A+'],
    'Own engine with a few AI-generated helper functions':      ['A', 'A', 'A'],
    'Own engine with generated helpers + one AI texture':       ['A', 'A', 'A'],
    'TiXL by its own authors, everything handmade':             ['A+', 'A+', 'A+'],
    'Own engine, one stock font':                               ['A', 'A', 'A'],
    'Own engine, AI-generated soundtrack':                      ['D', 'D', 'E'],
    'Own engine, shaders mostly AI-generated then reworked':    ['D', 'D', 'D'],
    'Own framework mostly AI-generated, content handmade':      ['B', 'B', 'B'],
    'TiXL / Unity, everything else handmade':                   ['B', 'B', 'B'],
    'TiXL + stock textures + sample-pack drums (reworked)':     ['B', 'C', 'C'],
    'Unity + asset-store 3D + AI soundtrack':                   ['F', 'F', 'E'],
    'Everything generated':                                     ['F', 'F', 'F'],
  };
  for (const s of M.SCENARIOS) {
    for (const vid of M.VARIANT_ORDER) eq(`scenario decodes: ${vid} ${s.name}`, !!V[vid].decode(s[vid]), true);
    eq('scenario grades: ' + s.name, ['q1', 's1', 'd1'].map(vid => grade(vid, s[vid])), expected[s.name]);
    eq('merging visuals and 3D keeps the grade: ' + s.name, grade('s2', s.s2), grade('s1', s.s1));
  }

  // Records
  const noNames = { title: null, by: null, at: null };
  const rec = { variant: 's1', answers: '11_00030', prod: 'pz94176', ...noNames };
  eq('record round trip', M.decodeRecord('#' + M.encodeRecord(rec), V), rec);
  eq('short code', M.shortCode(rec), 'MBU-s1-11_00030-pz94176');
  eq('short code decodes', M.decodeRecord(M.shortCode(rec), V), rec);
  eq('hidden slots survive short code', M.decodeRecord('MBU-d1-0_00_110_0_0_', V), { variant: 'd1', answers: '0_00_110_0_0_', prod: null, ...noNames });
  eq('full url', M.decodeRecord('https://x.example/#q1/0_012', V), { variant: 'q1', answers: '0_012', prod: null, ...noNames });

  // Free-text names: usable before any Demozoo / Pouët entry exists.
  const named = { variant: 's1', answers: '0_000000', prod: null, title: 'Ünd / Äus & <Co>?', by: 'Group #1 + friends', at: 'Revision 2026' };
  eq('names round trip', M.decodeRecord('#' + M.encodeRecord(named), V), named);
  eq('names round trip through a full url', M.decodeRecord('https://x.example/#' + M.encodeRecord(named), V), named);
  eq('names and production id', M.decodeRecord('s1/0_000000/pz42?t=Elevated&by=RGBA', V),
    { variant: 's1', answers: '0_000000', prod: 'pz42', title: 'Elevated', by: 'RGBA', at: null });
  eq('id can be added later, answers unchanged', M.encodeRecord({ ...named, prod: 'dz7' }).startsWith('s1/0_000000/dz7?'), true);
  eq('names not in short code', M.shortCode(named), 'MBU-s1-0_000000');
  eq('unknown keys ignored', M.decodeRecord('s1/0_000000?x=1&t=A', V).title, 'A');
  eq('too long name rejected', M.decodeRecord('s1/0_000000?t=' + 'x'.repeat(M.NAME_MAX + 1), V), null);
  eq('control characters removed', M.cleanName(' a\nb\tc '), 'a b c');
  eq('empty name is null', M.cleanName('   '), null);
  eq('name line', M.nameLine(named), '\u201cÜnd / Äus & <Co>?\u201d by Group #1 + friends @ Revision 2026');
  eq('name line, group only', M.nameLine({ by: 'RGBA' }), 'by RGBA');
  eq('no name line', M.nameLine({}), null);

  // Rejections
  eq('unknown variant', M.decodeRecord('x1/000', V), null);
  eq('too short', V.s1.decode('0_00000'), null);
  eq('option out of range', V.q1.decode('0_030'), null);
  eq('framework out of range', V.q1.decode('t_000'), null);
  eq('authors follow-up hidden for own code', V.q1.decode('00000'), null);
  eq('authors follow-up required for listed tool', V.q1.decode('1_000'), null);
  eq('no authors follow-up for other engine', V.q1.decode('80_00'), null);
  eq('AI share asked for own code', V.q1.decode('0__00'), null);
  eq('AI share asked for our own tool', V.q1.decode('10_00'), null);
  eq('AI share not asked for a tool we did not make', V.q1.decode('11000'), null);
  eq('AI share not asked for other engine', V.q1.decode('8_000'), null);
  eq('legacy mostly-AI engine still decodes', !!V.s1.decode('9__00000'), true);
  eq('hidden must be _', V.d1.decode('0_0000_0_0_0_'), null);
  eq('visible must not be _', V.d1.decode('0_01_0_0_0_0_'), null);
  eq('bad production', M.decodeRecord('q1/0_000/xx1', V), null);

  // Completeness
  eq('incomplete quick', V.q1.isComplete([0, null, 0, null, 0]), false);
  eq('authors follow-up needed for listed tool', V.q1.isComplete([1, null, null, 0, 0]), false);
  eq('AI share needed for own code', V.q1.isComplete([0, null, null, 0, 0]), false);
  eq('detailed: rework only needed when asked', V.d1.isComplete([0, null, 0, 0, null, 0, null, 0, null, 0, null, 0, null]), true);
  eq('detailed: rework needed when asked', V.d1.isComplete([0, null, 0, 1, null, 0, null, 0, null, 0, null, 0, null]), false);

  // Group rules, every variant
  const allOk = { q1: '0_000', s1: '0_000000', d1: '0_00_0_0_0_0_', s2: '0_00000' };
  for (const vid of M.VARIANT_ORDER) {
    const rest = allOk[vid].slice(3);
    eq(`${vid}: all ours -> A+`, grade(vid, allOk[vid]), 'A+');
    eq(`${vid}: a little AI in our own engine -> A`, grade(vid, '0_1' + rest), 'A');
    eq(`${vid}: notable AI part of our own engine -> B`, grade(vid, '0_2' + rest), 'B');
    eq(`${vid}: own engine mostly AI-generated -> B`, grade(vid, '0_3' + rest), 'B');
    eq(`${vid}: third-party tool -> B`, grade(vid, '51_' + rest), 'B');
    eq(`${vid}: other third-party engine -> B`, grade(vid, '8__' + rest), 'B');
    eq(`${vid}: legacy mostly AI-generated engine -> B`, grade(vid, '9__' + rest), 'B');
    eq(`${vid}: listed tool, we are its authors -> A+`, grade(vid, '100' + rest), 'A+');
    eq(`${vid}: our own tool, a little AI in it -> A`, grade(vid, '101' + rest), 'A');
    eq(`${vid}: a little AI in engine never beats nothing`, grade(vid, '0_1' + rest) !== 'A+', true);
  }
  eq('built with own engine', M.builtWith(V.s1.decode('0_000000')), 'Built with our own engine');
  eq('built on mostly generated engine', M.builtWith(V.s1.decode('0_300000')), 'Built on a mostly AI-generated engine');
  eq('built with TiXL', M.builtWith(V.s1.decode('11_00000')), 'Built with TiXL');
  eq('built with our own TiXL', M.builtWith(V.s1.decode('10000000')), 'Built with TiXL \u2014 our own tool');
  eq('built with other', M.builtWith(V.s1.decode('8__00000')), 'Built with a third-party engine');
  eq('strip shows framework AI share', V.s1.strip(V.s1.decode('0_100000')), 'F1 E0 V0 M0 A0 D0');
  eq('strip omits it when none', V.s1.strip(V.s1.decode('0_000000')), 'E0 V0 M0 A0 D0');
  eq('s1: any category mostly not ours -> D at best', ['30000', '03000', '00300', '00030', '00003'].map(c => grade('s1', '0_0' + c)).every(g => M.GRADES.indexOf(g) >= 4), true);
  eq('d1: any category mostly not ours -> D at best', [3, 5, 7, 9, 11].every(i => {
    const vals = V.d1.decode('0_00_0_0_0_0_'); vals[i] = 3; vals[i + 1] = 0;
    return V.d1.score(vals).gradeIndex >= 4;
  }), true);

  // Engines: every listed tool caps at B, unless we are its authors.
  const E = M.ENGINES;
  eq('engine ids unique', new Set(E.map(e => e.id)).size, E.length);
  eq('engines fit one base-36 character', E.length <= 36, true);
  eq('form lists every engine once, except legacy mostly-AI', V.s1.questions[0].order.slice().sort((a, b) => a - b),
    E.map((e, i) => i).filter(i => E[i].id !== 'ai'));
  const enc = (i) => i.toString(36);
  for (let i = 0; i < E.length; i++) {
    const e = E[i];
    if (e.id === 'own') { eq('own engine -> A+', grade('s1', '0_000000'), 'A+'); continue; }
    if (!e.listed) { eq(`${e.id} -> B`, grade('s1', enc(i) + '__00000'), 'B'); continue; }
    eq(`${e.id}: not ours -> B, ours -> A+`, [grade('s1', enc(i) + '1_00000'), grade('s1', enc(i) + '0000000')], ['B', 'A+']);
  }
  eq('built with PICO-8', M.builtWith(V.s1.decode(enc(E.findIndex(e => e.id === 'pico8')) + '1_00000')), 'Built with PICO-8');

  // Incentive: for any content answers, a third-party engine never scores better than our own
  // framework with any AI share.
  for (const vid of M.VARIANT_ORDER) {
    const v = V[vid];
    let bad = null;
    const content = v.questions.slice(3);
    const vals = [0, null, 0].concat(content.map(() => null));
    (function walk(i) {
      if (bad) return;
      if (i === vals.length) {
        for (let fa = 0; fa < 4; fa++) {
          const ours = vals.slice(); ours[2] = fa;
          const theirs = vals.slice(); theirs[0] = 5; theirs[1] = 1; theirs[2] = null;
          if (v.score(theirs).gradeIndex < v.score(ours).gradeIndex) bad = v.encode(ours) + ' vs ' + v.encode(theirs);
        }
        return;
      }
      if (!v.visible(vals, i)) { vals[i] = null; walk(i + 1); return; }
      for (let o = 0; o < v.questions[i].options.length; o++) { vals[i] = o; walk(i + 1); }
      vals[i] = null;
    })(3);
    eq(`${vid}: third-party engine never beats our own`, bad, null);
  }

  // Monotonic: making any single answer worse (higher option) never improves the grade.
  // The engine question is categorical (tested above); one representative per kind is enough.
  const engineKinds = [0, E.findIndex(e => e.id === 'tixl'), E.findIndex(e => e.id === 'other'), E.findIndex(e => e.id === 'ai')];
  for (const vid of M.VARIANT_ORDER) {
    const v = V[vid], qs = v.questions;
    let checked = 0, bad = null;
    const vals = new Array(qs.length).fill(null);
    (function walk(i) {
      if (bad) return;
      if (i === qs.length) {
        const g = v.score(vals).gradeIndex;
        for (let k = 0; k < qs.length && !bad; k++) {
          if (qs[k].categorical || vals[k] === null || vals[k] + 1 >= qs[k].options.length) continue;
          const worse = vals.slice();
          worse[k]++;
          // A newly asked follow-up starts at its best answer.
          for (let j = k + 1; j < qs.length; j++) {
            if (v.visible(worse, j) && worse[j] === null) worse[j] = 0;
            if (!v.visible(worse, j)) worse[j] = null;
          }
          checked++;
          if (v.score(worse).gradeIndex < g) bad = v.encode(vals) + ' -> ' + v.encode(worse);
        }
        return;
      }
      if (!v.visible(vals, i)) { vals[i] = null; walk(i + 1); return; }
      const opts = qs[i].categorical ? engineKinds : qs[i].options.map((o, idx) => idx);
      for (const o of opts) { vals[i] = o; walk(i + 1); }
      vals[i] = null;
    })(0);
    eq(`${vid}: monotonic (${checked} neighbours)`, bad, null);
  }

  // Label
  const svg = M.labelSvg({ gradeIndex: 2, headline: 'Built with TiXL', detail: 'E1 V0 M0 A0 D0' }, { count: 2, isDark: (r, c) => r === c });
  eq('label svg', svg.startsWith('<svg') && svg.includes('M0 0h1v1h-1z') && svg.includes('Built with TiXL'), true);
  eq('label escapes text', M.labelSvg({ gradeIndex: 0, headline: '<x>', detail: 'a&b' }, null).includes('&lt;x>'), true);
  // Standard v2: visuals and 3D merged.
  eq('s2 has four content categories', V.s2.questions.length - 3, 4);
  eq('s2 merged category', V.s2.questions[4].title, 'Visuals & 3D');
  eq('s1 still decodes with five', !!V.s1.decode('0_000000') && !V.s2.decode('0_000000'), true);
  eq('s1 -> s2 takes the larger of visuals and 3D', [M.s1ToS2('11_01230'), M.s1ToS2('11_02130')], ['11_0230', '11_0230']);
  eq('s2 slide names', V.s2.parts(V.s2.decode('0_00000')).map(p => p.short), ['Engine', 'Effects', 'Visuals', 'Audio', 'Direction']);

  // Label styles: every style renders for every variant; bars and percent fall back without parts.
  const labelOf = (vid, code) => {
    const v = V[vid], vals = v.decode(code), parts = v.parts ? v.parts(vals) : null;
    return { gradeIndex: v.score(vals).gradeIndex, headline: M.builtWith(vals), name: 'x', detail: v.strip(vals),
      parts, percent: parts ? parts.reduce((a, p) => a + p.ours, 0) / parts.length : null };
  };
  const qr2 = { count: 2, isDark: (r, c) => r === c };
  for (const st of M.LABEL_STYLES) for (const vid of M.VARIANT_ORDER) {
    const svg = M.labelSvg(labelOf(vid, M.SCENARIOS[3][vid]), qr2, st.id);
    eq(`style ${st.id} renders for ${vid}`, svg.startsWith('<svg') && svg.endsWith('</svg>') && svg.includes('M0 0h1v1h-1z'), true);
  }
  const ownAll = labelOf('s1', '0_000000');
  eq('bars: six parts, all ours', ownAll.parts.map(p => p.ours), [1, 1, 1, 1, 1, 1]);
  eq('percent: all ours is 100%', M.labelSvg(ownAll, null, 'percent').includes('>100%<'), true);
  eq('percent: third-party engine, rest ours', Math.round(labelOf('s1', '51_00000').percent * 100), 83);
  eq('percent: AI soundtrack', Math.round(labelOf('s1', '0_000003').percent * 100), 88);
  eq('bars: framework share follows AI share', labelOf('s1', '0_200000').parts[0].ours, 0.7);
  eq('quick has no parts', V.q1.parts, undefined);
  eq('bars falls back to grade without parts', M.labelSvg(labelOf('q1', '0_000'), null, 'bars').includes('>A+<'), true);
  eq('mono uses no grade colors', M.GRADE_COLORS.every(c => !M.labelSvg(ownAll, null, 'mono').includes(c)), true);
  const slide = M.labelSvg(labelOf('s2', '0_00203'), qr2, 'slide');
  eq('slide: no percentages, no codes, no name', !/\d%/.test(slide) && !slide.includes('E0') && !slide.includes('>x<'), true);
  eq('slide: short part names', ['Engine', 'Effects', 'Visuals', 'Audio', 'Direction'].every(n => slide.includes('>' + n + '<')), true);
  eq('columns: short part names', ['Engine', 'Direction'].every(n => M.labelSvg(labelOf('s2', '0_00000'), qr2, 'columns').includes('>' + n + '<')), true);
  const colsTixl = M.labelSvg({ ...labelOf('s2', '11_0000'), headline: 'Built with TiXL' }, qr2, 'columns');
  eq('columns: brand continues with …with', colsTixl.includes('>\u2026with TiXL<') && !colsTixl.includes('Built with'), true);
  eq('compact styles fall back to minimal without parts', M.labelSvg(labelOf('q1', '0_000'), null, 'columns'), M.labelSvg(labelOf('q1', '0_000'), null, 'minimal'));
  eq('unknown style falls back to grade', M.labelSvg(ownAll, null, 'nope') === M.labelSvg(ownAll, null, 'grade'), true);

  const namedSvg = M.labelSvg({ gradeIndex: 0, headline: 'Built with our own engine', name: '\u201cA&B\u201d by <C>', detail: 'E0' }, null);
  eq('label shows escaped name', namedSvg.includes('A&amp;B') && namedSvg.includes('&lt;C>'), true);
  eq('label grows for the name line', namedSvg.includes('height="192"'), true);
  eq('long name truncated on label', M.labelSvg({ gradeIndex: 0, headline: 'x', name: 'y'.repeat(60), detail: 'E0' }, null).includes('y'.repeat(39) + '\u2026'), true);

  lines.push(fails ? `${fails} FAILED` : 'ALL PASSED');
  document.getElementById('out').textContent = lines.join('\n');
})();
</script>
